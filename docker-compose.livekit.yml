# Canlı ders SFU (LiveKit, Apache-2.0, self-hosted) — İSTEĞE BAĞLI katman.
#
# 26 Eyl 2026: docker-compose.prod.yml'den ayrıldı. Orada `:?` zorunluluğu
# LiveKit hiç kullanılmadığı hâlde bütün compose'u (deploy'u) durduruyordu;
# zorunluluğu gevşetmek ise anahtarsız bir SFU'yu mümkün kılardı (fail-open).
# Ayrı dosya ikisini birden çözer: dosya eklenmedikçe LiveKit yoktur, eklenince
# anahtarlar yine ZORUNLUDUR.
#
# Açmak:  docker compose -f docker-compose.prod.yml -f docker-compose.livekit.yml \
#           [-f docker-compose.staging.yml] --env-file .env.prod up -d livekit
# Gerekenler (.env.prod): LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_NODE_IP.
#
# Signaling (7880) yayınlanmaz: Caddy `canli.<alan>` bloğundan iç ağ
# üzerinden erişir. Dışarı yalnız medya portları çıkar.
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY gerekli}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET gerekli}"
      NODE_IP: ${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP gerekli}
    volumes:
      - ./devops/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    mem_limit: 768m
    cpus: "1.0"
