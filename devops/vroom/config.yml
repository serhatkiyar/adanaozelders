# VROOM yapılandırması — yol ağı maliyetleri compose'daki OSRM'den gelir.
# (docker-compose.yml 'routing' profili; bkz. scripts/setup-osrm-adana.ps1)
cliArgs:
  geometry: true # rota polyline'ı dönsün (panel haritası çizer)
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  # DİKKAT: bu tavan OSRM'in --max-table-size'ından KÜÇÜK olmalı. VROOM her
  # planlamada (durak sayısı + araç sayısı) koordinatlık bir `table` sorgusu
  # atar; OSRM tavanı aşılırsa "TooBig" döner ve backend sessizce haversine'e
  # düşer. compose'da OSRM 500 ile açılır → burada 400 güvenli tavandır.
  maxlocations: 400
  maxvehicles: 5
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: 'osrm'
      port: '5000'
