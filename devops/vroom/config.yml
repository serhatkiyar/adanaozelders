# VROOM yapılandırması — yol ağı maliyetleri compose'daki OSRM'den gelir.
# (docker-compose.yml 'routing' profili; bkz. scripts/setup-osrm-adana.ps1)
cliArgs:
  geometry: true # rota polyline'ı dönsün (panel haritası çizer)
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  maxlocations: 200 # kampanya günü tavanı 150 durak + pay
  maxvehicles: 5
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeouts:
    response: 30000
routingServers:
  osrm:
    car:
      host: 'osrm'
      port: '5000'
