# Adana Özel Ders — ÜRETİM compose'u.
#
# Geliştirme dosyasından (docker-compose.yml) üç temel farkı vardır:
#
#   1. `:-varsayilan` FALLBACK YOKTUR. Bir env eksikse compose hata verir.
#      Geliştirmedeki `JWT_SECRET_KEY:-change-this-...` benzeri fallback'ler
#      üretime taşınırsa JWT forge edilebilir hale gelir (herkes admin token'ı
#      üretir) — bu yüzden burada değişkenler `${VAR:?...}` ile ZORUNLUDUR.
#   2. Hiçbir servis portu host'a yayınlanmaz. Postgres/Redis/MinIO yalnız iç
#      ağdadır; dışarıya açılan tek şey Caddy'nin 80/443'üdür.
#   3. MailHog yoktur; e-posta gerçek SMTP'ye gider (guard `EMAIL_PROVIDER=console`
#      olmasını zaten reddeder).
#
# Kullanım:
#   cp .env.prod.example .env.prod && nano .env.prod      # sırları doldur
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod \
#       run --rm backend python -m alembic upgrade head   # migration AYRI adım
#
# Yedekleme: scripts/backup-postgres.sh (cron ile günlük).

name: adana-ozel-ders-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli (ör. adanaozelders.com.tr)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL gerekli (Let's Encrypt bildirimleri)}
    volumes:
      - ./devops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # sertifikalar — SİLMEYİN, oran sınırına takılırsınız
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Kalıcılık: rate-limit sayaçları kaybolabilir ama token denylist'i
    # (logout edilmiş oturumlar) kaybolmamalı — AOF ile diske yazılır.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── Gerçek-zamanlı pub/sub (Centrifugo) ──
  # NEDEN: core/ws_manager.py tek-process bellek-içidir; replika sayısı 1'den
  # büyüdüğünde replikalar arası push kaybolur. Centrifugo Redis üzerinden
  # fan-out yapar. Sürüm SABİT (`:latest` yok — minio dersi).
  centrifugo:
    image: centrifugo/centrifugo:v6.9.6
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./devops/centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET gerekli (openssl rand -hex 32)}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY gerekli (openssl rand -hex 32)}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      redis:
        condition: service_healthy

  # Canlı ders SFU (LiveKit) ayrı dosyada: docker-compose.livekit.yml. Lansmanda
  # canlı ders Zoom Video SDK ile; LiveKit açılınca o dosya da -f ile eklenir.

  # İmaj kaynağı quay.io ve SÜRÜM SABİT: `minio/minio:latest` (Docker Hub) artık
  # çekilemiyor — depo kaldırıldı, anonim çekme `repository does not exist` ile
  # reddediliyor (CI bu yüzden düştü). MinIO'nun kanonik kayıt defteri quay.io.
  #
  # Seçilen sürüm ÜRETİMDE ÇALIŞAN imajın ta kendisidir: koşan konteynerin imaj
  # kimliği bu digest, `release` etiketi bu sürüm. Yani bu bir SÜRÜM YÜKSELTMESİ
  # değil, hâlihazırda çalışan imajın çekilebilir bir adresle sabitlenmesidir.
  # Veri volume'ü, komut, port, environment ve healthcheck sözleşmesi AYNEN kalır
  # (`mc` imajda mevcut: /usr/bin/mc).
  #
  # 27 Eyl 2026 (R2 geçişi): dosyalar Cloudflare R2'de. MinIO YALNIZ geçiş
  # (eski nesneleri R2'ye kopyalama) ve geri dönüş için `eski-depo` profilinde
  # durur; varsayılan `up` onu AÇMAZ ve backend ona bağlı DEĞİLDİR. Veri volume'ü
  # (`miniodata`) korunur — kopyalama doğrulanmadan silinmez.
  minio:
    profiles: ["eski-depo"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID gerekli}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY gerekli}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Rota optimizasyonu (teslimat Faz B) ──
  # Geliştirmede opsiyonel profildir; ÜRETİMDE zorunludur: yoksa ROUTING_PROVIDER
  # `auto` sessizce kuş uçuşu tahmine düşer ve müşteriye gösterilen varış
  # penceresi ("18:00–19:00") gerçek yol ağından değil 28 km/sa varsayımından
  # üretilir. Guard `haversine`'i reddeder, /health bozulmayı raporlar.
  #
  # ÖN KOŞUL (tek seferlik, deploy'dan önce sunucuda):
  #   ./scripts/setup-osrm-adana.sh      # devops/osrm/adana.osrm* üretir
  # OSM verisi ayda bir tazelenmelidir (aynı betik; sonra `restart osrm`).
  osrm:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    # --max-table-size: VROOM arkada `table` (mesafe matrisi) servisini çağırır;
    # osrm-routed varsayılanı 100 koordinattır ve 100+ duraklı kampanya gününde
    # "TooBig" döner. VROOM maxlocations (400) bunun altında kalmalıdır.
    command: osrm-routed --algorithm mld --max-table-size 500 /data/adana.osrm
    volumes:
      # Salt-okunur bağlama yeterlidir (denendi: osrm-routed MLD verisini yazmadan
      # açar). Veri host'ta durur → konteyner yeniden başlayınca kaybolmaz.
      - ./devops/osrm:/data:ro
    # Ölçüldü (Adana veri seti): boşta ~270 MB, 300 duraklık planda ~278 MB ve
    # tek çekirdeğin ~%75'i. Sınırlar 3-4× pay bırakır; amaç tek VPS'te kaçak bir
    # planlamanın Postgres'i aç bırakmasını önlemek.
    mem_limit: 1g
    cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    restart: unless-stopped
    depends_on:
      osrm:
        condition: service_healthy
    volumes:
      - ./devops/vroom:/conf:ro
    environment:
      VROOM_ROUTER: osrm
    # Ölçüldü: boşta ~44 MB, 300 duraklık planda ~46 MB (ağır iş OSRM tarafında).
    mem_limit: 512m
    cpus: "1.0"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # Guard'ın açılışta doğruladığı değerler (bkz. core/config.py::_guard_production).
      ENVIRONMENT: production
      AUTO_CREATE_DB: "False"
      SEED_DEMO_DATA: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      # Nesne deposu: Cloudflare R2 (27 Eyl 2026). Değerler `.env.prod`'dan gelir;
      # eksikse compose AÇILMAZ. Eskiden burada `http://minio:9000` sabitlenmişti
      # ve .env'deki adresi sessizce eziyordu — o geçersiz kılma kaldırıldı.
      # Sırlar (AWS_ACCESS_KEY_ID/SECRET) yalnız `env_file` ile gelir.
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:?AWS_ENDPOINT_URL gerekli (R2 S3 API adresi)}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:?S3_PUBLIC_BUCKET gerekli}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:?S3_PRIVATE_BUCKET gerekli}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL gerekli (ör. https://cdn.alan.com)}
      # R2 bucket'ları ve policy'si konsoldan yönetilir; açılışta dokunulmaz.
      S3_MANAGE_BUCKETS: "False"
      # Rota: servis adıyla (konteynerde `localhost` backend'in kendisidir —
      # guard yerel adresi zaten reddeder). `auto` VROOM düşerse çalışmayı
      # sürdürür; bozulma /health + ERROR log ile görünür kalır.
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-auto}
      VROOM_URL: http://vroom:3000
      # SEO ön-çizimi (Modül 6): derlenmiş index.html şablonu frontend
      # konteynerinden iç istekle alınır (60 sn önbellek). Frontend nginx'i
      # SEO şeklindeki yolları `/__sayfa`ya yollar (frontend/nginx.conf).
      FRONTEND_INTERNAL_URL: http://frontend:80
      # Gerçek-zamanlı katman. Burada yalnız şalter ve adres var; iki sır
      # (CENTRIFUGO_API_KEY / CENTRIFUGO_TOKEN_HMAC_SECRET) yukarıdaki
      # `env_file: .env.prod` ile gelir — tek kaynakta durur, burada
      # tekrarlanmaz. Boş kalırlarsa uygulama AÇILMAZ (_guard_centrifugo).
      CENTRIFUGO_ENABLED: "True"
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # osrm/vroom BİLEREK burada YOK. `depends_on` zinciri geçişlidir: vroom
      # osrm'in sağlıklı olmasını bekler, backend de vroom'un başlamasını
      # bekleseydi **eksik ya da bozuk OSRM verisi TÜM API'yi ayağa kaldırmazdı**
      # (deneyle doğrulandı: "dependency failed to start ... is unhealthy").
      # Rota ikincil bir yetenektir: çökerse teslimat planlaması bozulur,
      # `auto` modu tahmine düşer, site çalışmaya devam eder.

  # ── Eğitmen tanıtım videosu işçisi (FFmpeg) ──
  # Backend ile AYNI kod, `worker` imaj hedefi (ffmpeg/ffprobe içerir; API
  # imajı şişmez). Kuyruk DB tablosudur (`FOR UPDATE SKIP LOCKED`), Redis/Celery
  # yok. Ayrı konteyner: 2 dakikalık kaynağı 720p'ye çevirmek CPU'yu dakikalarca
  # doyurur; API ile aynı süreçte koşsa istek gecikmesi ve health check aşımı
  # olurdu. Kaynak sınırı burada: `cpus`/`mem_limit`. Çökmesi siteyi etkilemez;
  # yarıda kalan iş stale geri alma ile kuyruğa döner (bkz. workers/video_worker).
  video-worker:
    build:
      context: ./backend
      target: worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_DB: "False"
      SEED_DEMO_DATA: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:?AWS_ENDPOINT_URL gerekli (R2 S3 API adresi)}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:?S3_PUBLIC_BUCKET gerekli}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:?S3_PRIVATE_BUCKET gerekli}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL gerekli (ör. https://cdn.alan.com)}
      S3_MANAGE_BUCKETS: "False"
      CENTRIFUGO_ENABLED: "True"
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      # Tek video işler; havuz küçük.
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ≤300 MB kaynak + çıktı geçici olarak tmpfs'te; disk yazma yok.
    tmpfs:
      - /tmp:size=1g
    mem_limit: 1g
    cpus: "1.0"

  frontend:
    build:
      context: ./frontend
      args:
        # Aynı origin: Caddy /api/* yolunu backend'e proxy'ler.
        VITE_API_BASE_URL: /api/v1
        VITE_SITE_URL: https://${DOMAIN}
        VITE_GA_ID: ${VITE_GA_ID:-}
        VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
        VITE_CLARITY_ID: ${VITE_CLARITY_ID:-}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
  caddy_logs:
