[pytest]
pythonpath = .
asyncio_mode = auto
; Event loop kapsamı AÇIKÇA yazılır — varsayılana bırakılmaz.
;
; Neden (21 Ağu 2026'da ölçüldü): `tests/verify/run.py` pytest'i komut
; satırından `-o asyncio_default_*_loop_scope=session` ile çağırıyordu, CI ise
; düz `pytest tests/verify` koşuyordu ve pytest-asyncio 1.x varsayılanı
; FONKSİYON kapsamıdır. Yani yerel prova ile CI aynı yapılandırmayı
; koşmuyordu: havuzda bağlantı bırakan bir test yerelde (tek loop) zararsız
; görünüyor, CI'da (test başına yeni loop) "got Future attached to a different
; loop" ile ERROR veriyordu. Hata üç gün yerelde yeniden üretilemedi.
;
; Değer `run.py`'nin zorladığıyla AYNIDIR; ikisi ayrışırsa bu sınıf hata geri
; gelir. Sızıntının kendisi artık kapsamdan bağımsız olarak
; `tests/verify/conftest.py::_havuz_nobetcisi` ile yakalanır — bu ayar
; ortamları hizalar, nöbetçinin yerini almaz.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
