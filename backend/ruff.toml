# Ruff — CI'da koşan lint yapılandırması.
#
# Amaç GERÇEK HATA yakalamak, stil tartışması açmak değil. Varsayılan kural
# seti bu kod tabanında 1400+ uyarı üretiyor ve ezici çoğunluğu kozmetik
# (tırnaklı annotation, import sırası); onları CI'da zorlamak her PR'ı
# alakasız gürültüyle doldururdu. Aşağıdaki dar set, kırıcı sınıfları tutar.
#
# Kural eklemek serbest — ama yeni bir kural açarken mevcut ihlalleri de
# temizleyin; CI'nın sürekli kırmızı olması onu işe yaramaz hale getirir.

line-length = 100
target-version = "py311"

exclude = [
    "migrations/versions",  # autogenerate çıktısı — biçimi Alembic belirler
    ".venv",
    "__pycache__",
]

[lint]
select = [
    "E9",   # syntax / IO hataları
    "F",    # Pyflakes: tanımsız ad, kullanılmayan import/değişken
    "B",    # flake8-bugbear: gerçek tuzaklar (mutable default, loop capture…)
    "PLE",  # Pylint error sınıfı
    "T20",  # print() üretimde loglama yerine geçmesin
]

ignore = [
    # SQLAlchemy ilişkileri string forward-reference kullanır
    # (`Mapped["Tutor"]`); registry runtime'da çözer, tanımsız ad DEĞİLDİR.
    "F821",
    # FastAPI'nin bel kemiği: `x = Depends(...)` varsayılan argümanda çağrıdır.
    "B008",
    # Döngü içinde tanımlanıp AYNI iterasyonda çağrılan closure'lar var
    # (delivery_service._find_planned, store_service._g/_int/_dec);
    # doğrulandı, geç bağlama sorunu yok.
    "B023",
]

[lint.per-file-ignores]
# Testlerde kasıtlı kullanılmayan değişkenler ve yeniden tanımlar olur.
"tests/*" = ["F841", "B011"]
# Doğrulama runner'ı bir CLI aracıdır; komutu kullanıcıya yazdırır.
"tests/verify/run.py" = ["T20"]
# Ölçek provası araçları (seed + sorgu ölçümü) CLI'dır: ölçüm tablosunu ve
# EXPLAIN planlarını konsola basar — çıktı zaten ürünün kendisidir.
"scripts/scale/*.py" = ["T20"]
# Depolama taşıma aracı da CLI: taşınacak/taşınan her nesneyi rapor eder
# (dry-run çıktısı, uygulamadan önce gözden geçirilen şeyin ta kendisidir).
"scripts/migrate_storage_visibility.py" = ["T20"]
# İlçe backfill aracı da CLI: hangi eğitmene hangi ilçenin YAZILACAĞINI
# uygulamadan önce satır satır basar. Prova çıktısı, gözden geçirilen şeyin ta
# kendisidir — `location_text` serbest metninden ilçe çıkarımı elle
# doğrulanmadan uygulanmamalı.
"scripts/ilce_backfill.py" = ["T201"]
# Aşağıdaki üçü de argparse'lı CLI araçlarıdır ve konsol çıktısı ARACIN
# KENDİSİDİR. İstisna dosya + kural bazında dar tutulur — `scripts/` dizinine
# toplu muafiyet verilmez, yoksa yarın eklenen bir script sessizce muaf olur.
#
# Mutasyon provası sürücüsü: hangi mutasyonun uygulandığını, hangi testin
# kırıldığını ve geri almanın doğrulandığını adım adım yazar; bu çıktı
# CLAUDE.md §D'nin istediği kanıtın ta kendisidir.
"scripts/mutation_drill.py" = ["T201"]
# İP-14 mutasyon provası sürücüsü — aynı gerekçe. Katalog ayrı tutuldu
# (İP-12 paralel çalışırken ortak dosyanın kataloğu büyütülmesin);
# güvenlik mekanizması `mutation_drill`ten import edilir.
"scripts/mutation_drill_ip14.py" = ["T201"]
# İP-16 mutasyon kataloğu: aynı sürücünün güvenlik makinesini kullanır, aynı
# gerekçeyle konuşur (seçilen test sayısı + kırılan testler + geri alma kanıtı).
"scripts/mutation_drill_ip16.py" = ["T201"]
# İP-18 mutasyon kataloğu: aynı güvenlik makinesi, aynı gerekçe. Ek olarak
# YEŞİL TABAN ÇİZGİSİ ve `ERROR` sayan kırılma taraması da konsola raporlanır —
# "prova geçerli miydi" sorusunun cevabı o çıktıdadır.
"scripts/mutation_drill_ip18.py" = ["T201"]
# Vitrin mutasyon kataloğu: aynı güvenlik makinesi, aynı gerekçe. Ayrıca
# kapsam ayrımını konsola yazar — beş mutasyon sürücüyle, iki veritabanı
# garantisi (GiST exclusion + tek-HOME index) ELLE SQL ile yapılır ve bu
# ayrım çıktıda görünmezse "7/7" cümlesi dürüst olmaz.
"scripts/mutation_drill_vitrin.py" = ["T201"]
# İP-16 F-15 altın referans üreticisi: test DEĞİL, kaynak kanıtıdır. Gerçek
# py-fsrs v5.1.3'e karşı çalıştırılıp `tests/data/ip16_fsrs_ref.json`'u basar;
# değerlerin nereden geldiği ancak bu betik okunarak doğrulanabilir.
"tests/data/ip16_fsrs_ref_generator.py" = ["T201"]
# Aynı gerekçe: DB kısıtı (DDL) mutasyon provası sürücüsü. Hangi kısıtın
# düşürüldüğünü, testin kırıldığını ve geri yüklemenin DAVRANIŞLA doğrulandığını
# adım adım yazar; çıktı provanın kanıtıdır.
"scripts/ip1b_ddl_drill.py" = ["T201"]
# Defter yeniden hesaplama aracı: dry-run'da ne değişeceğini, --apply'da ne
# değiştiğini satır satır bildirir; sessiz çalışması tehlikeli olurdu.
"scripts/dev_rebase_stock.py" = ["T201"]
# kitapsec kataloğu içe aktarma aracı: aynı gerekçe. Dry-run raporu (hangi
# satır hangi ISBN/stok/görsel notuyla yüklenecek) aracın ta kendisidir —
# --apply'dan önce gözden geçirilen şey o çıktıdır; parti parti ilerleyen
# uygulama da created/skipped/errors sayımını ve run_id'yi konsola yazar.
"scripts/import_kitapsec_books.py" = ["T201"]
# ucdortbes kataloğu içe aktarma aracı: aynı gerekçe. Dry-run raporu ve
# --apply'ın parti parti created/skipped/errors sayımı aracın çıktısıdır;
# kullanıcı ilerlemeyi konsoldan izler.
"scripts/import_ucdortbes.py" = ["T201"]
# Yıldırım B2B kataloğu içe aktarma aracı: aynı gerekçe, aynı `--uygula` kapısı.
# Kuru koşuda kaç satır okundu, kaçı fiyatsız diye atlandı, kaçı kategorisiz
# olduğu için DRAFT'a düştü ve kaç mevcut ürünün SOFT-DELETE edileceği yazılır.
# Soft-delete sayısı özellikle sessiz kalmamalı: --uygula'dan önce durduran şey
# tam olarak o satırdır.
"scripts/yildirim_katalog_import.py" = ["T201"]
# Stok defteri raporu: konsol tablosu aracın çıktısıdır (CSV opsiyoneldir).
"scripts/stock_ledger_report.py" = ["T201"]
# Ders taksonomisi dışa aktarımı: aracın ÇIKTISI rapordur. Kaç ders süzüldü,
# hangi eşanlamlı çakıştı ve atlandı, hangi yetim ders köke alındı, hangi slug
# çakışması nasıl çözüldü — üretilen dosyayı depoya almadan önce gözden
# geçirilen şey tam olarak bu satırlardır. Sessiz çalışması, kaynaktaki bir
# değişikliğin fark edilmeden taksonomiye sızması demek olurdu.
"scripts/dersler_disa_aktar.py" = ["T201"]
# Ders taksonomisi yükleyicisi: aynı gerekçe. Kuru koşu raporu (kaç yeni ders,
# hangi eşanlamlı çakıştı, hangi merdiven bağlandı) --uygula'dan ÖNCE gözden
# geçirilen şeyin ta kendisidir.
"scripts/dersler_yukle.py" = ["T201"]
# Kategori taksonomisi yükleyicisi (kategori ağacı + ürün atamaları): aynı
# gerekçe ve aynı `--uygula` kapısı. Kuru koşuda kaç kategori upsert edileceğini,
# kaç ürünün barkodla / id ile eşlendiğini ve atamaların yedeğinin nereye
# yazıldığını basar; yedek dosyasının yolu ekrana yazılmazsa geri dönüş yolu
# kullanıcıdan gizlenmiş olurdu.
"scripts/taxonomy_yukle.py" = ["T201"]
# Branş eşleme aracı: hangi serbest metnin hangi derse bağlandığı ve hangisinin
# EŞLEŞMEDİĞİ, --uygula'dan önce gözden geçirilen çıktıdır; eşleşmeyenler
# panelin kuyruğuna düşecek kayıtlardır.
"scripts/brans_eslestir.py" = ["T201"]
# Tedarikçi tur tohumu: elle çalıştırılan bir CLI aracıdır ve konsol çıktısı
# aracın kullanıcıyla konuşma biçimidir. Özellikle "REDDEDİLDİ:" satırları
# (üretimde koşma reddi, SUPPLIER_NETWORK_DISABLED kapalıyken red) betiğin
# NEDEN durduğunu söyleyen tek kanaldır; logging'e çevirmek onları elle
# çalıştıran kullanıcıdan gizlerdi.
"scripts/tedarikci_tur_seed.py" = ["T201"]
# F30 gerçek tarayıcı kabulünün iki ucu. İkisi de **stdout'a tek satır JSON**
# yazar ve o çıktı bir sonraki adımın GİRDİSİDİR (tohum → tarayıcı sürücüsü →
# baskı denetimi). Logging'e çevirmek boru hattını kırardı; dosyaya yazmak ise
# kabulün nerede koştuğunu betiğin dışına taşırdı.
"scripts/f30_e2e_seed.py" = ["T201"]
"scripts/f30_baski_kabul.py" = ["T201"]
# Seed/bakım script'leri konsola yazar.
"seed_*.py" = ["T20"]
"add_*.py" = ["T20"]
"fix_*.py" = ["T20"]
"get_*.py" = ["T20"]
"cleanup_*.py" = ["T20"]
"backfill_*.py" = ["T20"]
"update_*.py" = ["T20"]
