# Güvenlik başlıkları — HER location bloğuna include edilir.
#
# NEDEN AYRI DOSYA VE NEDEN HER BLOKTA: nginx'te `add_header` kalıtımı
# "hepsi ya da hiçbiri"dir. Bir alt `location` kendi `add_header`'ını
# tanımladığı anda, üst bağlamdaki başlıkların TAMAMI o location için düşer.
# Bu sessiz bir tuzaktır: `location = /index.html` yalnız Cache-Control eklemek
# için bir `add_header` içerdiğinden, server seviyesine yazılmış bir CSP tam da
# CSP'nin uygulanacağı tek yerde — HTML belgesinde — kaybolurdu.
#
# TLS ve HSTS önde duran Caddy'de sonlanır (bkz. devops/Caddyfile); burada
# uygulama katmanının kendi savunması durur. CSP başlığı yalnız BURADA çıkar
# (değerleri frontend/nginx.conf'taki map'te):
# tarayıcı birden çok CSP başlığı gördüğünde hepsinin KESİŞİMİNİ uygular, iki
# ayrı liste zamanla ayrıştıkça yüzeyler öngörülemez biçimde kırılır.

# Tıklama-hırsızlığı (clickjacking): admin ve kurye ekranları görünmez bir
# iframe'e alınıp aksiyon tetiklenemesin.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Kamera yalnız kendi kaynağımıza (kurye foto kanıtı, operatör QR tarayıcı,
# canlı ders); konum yine kendimize (harita pin'i, "yakınımdaki"); mikrofon da
# kendimize — canlı ders iki yönlüdür ve `microphone=()` onu tarayıcı
# seviyesinde tamamen kapatıyordu.
#
# AYNI BAŞLIK devops/Caddyfile'da da var ve Caddy'nin `header` direktifi değeri
# EKLEMEZ, DEĞİŞTİRİR — yani üretimde tarayıcıya ULAŞAN değer Caddy'ninkidir.
# İkisi BİRLİKTE değişmelidir; yalnız buradaki düzeltme üretimde etkisiz kalır.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self)" always;

# ── İçerik Güvenlik Politikası ──
#
# XSS'e karşı ikinci savunma hattı: sayfaya bir şekilde kod enjekte edilse bile
# tarayıcı onu çalıştırmaz. Zincirin sonu oturum devriydi (token istemcide
# durur); bu satır zinciri script çalıştırma adımında keser.
#
#   script-src 'self'         Asıl koruma. Satır içi script yok, dış CDN yok
#                             (Tabler CDN'i Hafta 4'te npm'e taşındı). Tek
#                             istisna 26 Eyl 2026: Google Analytics
#                             (googletagmanager.com) ve Meta Pixel
#                             (connect.facebook.net), src/lib/analytics.ts.
#   style-src 'unsafe-inline' Tailwind ve Leaflet çalışma anında style
#                             özniteliği yazar; kaldırmak haritayı ve
#                             animasyonları bozar. Stil enjeksiyonu script
#                             çalıştıramaz — risk bilerek kabul edildi.
#   img-src / connect-src     Bu adresler deploy'a göre değişir (MinIO alan
#                             adı, harita tile'ları, Sentry, Open-Meteo).
#                             `https:` ile bırakıldı: script-src katı olduğu
#                             sürece görsel/istek kaynağını daraltmak ikincil
#                             kazanç. V2: kendi tile sunucumuza geçince daralt.
#   frame-src                 SABİT liste — gömülü ders (Jitsi), tanıtım
#                             videosu, harita ve Street View önizlemesi.
#   form-action 'self'        Enjekte edilen bir form kimlik bilgisini dışarı
#                             POST edemez. iyzico'ya geçiş yönlendirmedir
#                             (form gönderimi değil), etkilenmez.
#
# DEĞERLER nginx.conf'taki `map $request_uri $icerik_politikasi` içindedir:
# iki kol var — `/canli-ders/` (Zoom Video SDK için gevşek script-src) ve
# `default` (yukarıda anlatılan katı dize). Başlık yine TEK satırdan, burada
# çıkar; tek CSP başlığı ilkesi korunur.
add_header Content-Security-Policy $icerik_politikasi always;
