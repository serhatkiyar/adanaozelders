# ── İçerik Güvenlik Politikası: yola göre iki kol ──
#
# Başlık nginx-security-headers.conf'ta `$icerik_politikasi` ile çıkar; burada
# yalnız DEĞERİ seçilir. `map` http bağlamındadır (bu dosya conf.d/default.conf
# olarak http içine include edilir — bkz. Dockerfile).
#
# Anahtar `$request_uri`, `$uri` DEĞİL: SPA'da try_files sonrası `$uri`
# `/index.html` olur ve canlı ders sayfası varsayılan kola düşerdi.
# Alt `location` + ayrı `add_header` da KULLANILMAZ: nginx o location için üst
# başlıkların tamamını düşürür (nginx-security-headers.conf başı).
#
# `/canli-ders/` kolu = varsayılan dize, YALNIZ script-src genişletilmiş
# (Zoom Video SDK Web, developers.zoom.us/docs/video-sdk/web/browser-support):
#   'wasm-unsafe-eval'        SDK'nın ses/görüntü WASM modülleri derlenir.
#                             Zoom'un listesindeki 'unsafe-eval' ve
#                             'unsafe-inline' BİLEREK yok; önce gerçek
#                             tarayıcıda ölçülecek (Emscripten "dynamic" ses
#                             varyantları ASM_CONSTS için eval kullanıyor).
#   source.zoom.us, zoom.us,  SDK'nın `lib/` varlıklarını (worker, worklet,
#   *.zoom.us, cloudfront     wasm yükleyici) çektiği CDN'ler.
#   blob:                     Worker/AudioWorklet'ler blob URL'den açılır ve
#                             sayfanın CSP'sini devralır.
# connect/img/media/font/style/worker için mevcut dize yeterli (https:, wss:,
# 'unsafe-inline' stil, worker-src blob:; toolkit dış yazı tipi çekmez).
# Kalan her direktif iki kolda AYNI olmalı — nöbetçi:
# src/__guards__/icerikPolitikasi.test.ts.
map $request_uri $icerik_politikasi {
    ~^/canli-ders/ "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://source.zoom.us https://zoom.us https://*.zoom.us https://dmogdx0jrul3u.cloudfront.net blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:9000 http://127.0.0.1:9000 https:; media-src 'self' blob: https:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws://localhost:8000 ws://127.0.0.1:8000 https: wss:; worker-src 'self' blob:; frame-src 'self' https://meet.jit.si https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.openstreetmap.org https://www.google.com; manifest-src 'self'";
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:9000 http://127.0.0.1:9000 https:; media-src 'self' blob: https:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws://localhost:8000 ws://127.0.0.1:8000 https: wss:; worker-src 'self' blob:; frame-src 'self' https://meet.jit.si https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.openstreetmap.org https://www.google.com; manifest-src 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Sıkıştırma ──
    # Entry bundle ~613 KB; gzip'lenince ~188 KB. Sıkıştırma olmadan Adana'da
    # mobil bağlantıda ilk açılış üç katı sürer.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # Güvenlik başlıkları tek kaynakta (CSP dahil) ve HER blokta include edilir
    # — nginx'te bir location kendi add_header'ını tanımlayınca üsttekilerin
    # TAMAMI o location için düşer. Gerekçe: nginx-security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    # SPA: bilinmeyen yolları index.html'e düşür (react-router client-side routing).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # ── Kök SEO sayfaları: sunucuda ön-çizim (Modül 6) ──
    # Ders (`/matematik-ozel-ders`), ilçe+ders (`/seyhan/matematik-ozel-ders`),
    # ilan (`/lgs-yks-matematik-seyhan`) ve eski eğitmen adresi
    # (`/egitmenler/dilan-4`, 301 alır) ŞEKLİNDEKİ yollar backend'e gider;
    # backend derlenmiş index.html'e başlık/meta/JSON-LD ve #root içine
    # sayfanın içeriğini yerleştirip döner. Ayrım YOLA göredir, user-agent'a
    # DEĞİL: kullanıcı ve Googlebot aynı HTML'i alır (cloaking yok).
    #
    # Desen bilerek geniş (tireli her tek parçalı yol): `/sifremi-unuttum` gibi
    # SPA rotaları da buraya düşer ve backend onlara şablonu AYNEN döndürür.
    # Nokta içeren yol (dosya) ve `/assets/*` eşleşmez.
    #
    # Backend'e ulaşılamazsa ya da şablonu alamazsa (502/503/504) normal
    # index.html'e düşülür: sayfa yine açılır, yalnız ön-çizim gelmez.
    # `resolver` + değişken: `backend` adı nginx açılışında değil istek anında
    # çözülür; backend yokken nginx yine ayağa kalkar.
    location ~ "^/(egitmenler/[a-z0-9-]+|[a-z0-9]+(-[a-z0-9]+)+|[a-z0-9]+/[a-z0-9-]+-ozel-ders)$" {
        include /etc/nginx/snippets/security-headers.conf;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $seo_backend "backend:8000";
        proxy_pass http://$seo_backend/__sayfa?path=$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Orijinal-Sorgu $args;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # index.html ASLA cache'lenmemeli: içinde hash'li asset adları var, bayat
    # kopya deploy sonrası var olmayan chunk'lara işaret eder (beyaz ekran).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Statik varlıklar için uzun cache (dosya adları içerik-hash'li).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
