server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Sıkıştırma ──
    # Entry bundle ~613 KB; gzip'lenince ~188 KB. Sıkıştırma olmadan Adana'da
    # mobil bağlantıda ilk açılış üç katı sürer.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # ── Güvenlik başlıkları ──
    # Not: TLS ve HSTS önde duran Caddy'de sonlanır (bkz. devops/Caddyfile);
    # burada uygulama katmanının kendi savunması durur.
    # Tıklama-hırsızlığı (clickjacking): admin ve kurye ekranları görünmez bir
    # iframe'e alınıp aksiyon tetiklenemesin.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Kamera yalnız kendi kaynağımıza (kurye foto kanıtı, operatör QR tarayıcı);
    # konum yine kendimize (harita pin'i, "yakınımdaki").
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # SPA: bilinmeyen yolları index.html'e düşür (react-router client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ASLA cache'lenmemeli: içinde hash'li asset adları var, bayat
    # kopya deploy sonrası var olmayan chunk'lara işaret eder (beyaz ekran).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Statik varlıklar için uzun cache (dosya adları içerik-hash'li).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
