server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: bilinmeyen yolları index.html'e düşür (react-router client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlıklar için uzun cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
