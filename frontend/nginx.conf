server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Sıkıştırma ──
    # Entry bundle ~613 KB; gzip'lenince ~188 KB. Sıkıştırma olmadan Adana'da
    # mobil bağlantıda ilk açılış üç katı sürer.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # Güvenlik başlıkları tek kaynakta (CSP dahil) ve HER blokta include edilir
    # — nginx'te bir location kendi add_header'ını tanımlayınca üsttekilerin
    # TAMAMI o location için düşer. Gerekçe: nginx-security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    # SPA: bilinmeyen yolları index.html'e düşür (react-router client-side routing).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # ── Kök SEO sayfaları: sunucuda ön-çizim (Modül 6) ──
    # Ders (`/matematik-ozel-ders`), ilçe+ders (`/seyhan/matematik-ozel-ders`),
    # ilan (`/lgs-yks-matematik-seyhan`) ve eski eğitmen adresi
    # (`/egitmenler/dilan-4`, 301 alır) ŞEKLİNDEKİ yollar backend'e gider;
    # backend derlenmiş index.html'e başlık/meta/JSON-LD ve #root içine
    # sayfanın içeriğini yerleştirip döner. Ayrım YOLA göredir, user-agent'a
    # DEĞİL: kullanıcı ve Googlebot aynı HTML'i alır (cloaking yok).
    #
    # Desen bilerek geniş (tireli her tek parçalı yol): `/sifremi-unuttum` gibi
    # SPA rotaları da buraya düşer ve backend onlara şablonu AYNEN döndürür.
    # Nokta içeren yol (dosya) ve `/assets/*` eşleşmez.
    #
    # Backend'e ulaşılamazsa ya da şablonu alamazsa (502/503/504) normal
    # index.html'e düşülür: sayfa yine açılır, yalnız ön-çizim gelmez.
    # `resolver` + değişken: `backend` adı nginx açılışında değil istek anında
    # çözülür; backend yokken nginx yine ayağa kalkar.
    location ~ "^/(egitmenler/[a-z0-9-]+|[a-z0-9]+(-[a-z0-9]+)+|[a-z0-9]+/[a-z0-9-]+-ozel-ders)$" {
        include /etc/nginx/snippets/security-headers.conf;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $seo_backend "backend:8000";
        proxy_pass http://$seo_backend/__sayfa?path=$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Orijinal-Sorgu $args;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # index.html ASLA cache'lenmemeli: içinde hash'li asset adları var, bayat
    # kopya deploy sonrası var olmayan chunk'lara işaret eder (beyaz ekran).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Statik varlıklar için uzun cache (dosya adları içerik-hash'li).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
