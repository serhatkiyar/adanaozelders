# Proje adı AÇIKÇA sabitlenir: varsayılanı klasör adıdır ve klasör yeniden
# adlandırılınca compose eski container/volume'ları TANIMAZ (boş yeni volume açar,
# MinIO verisi "kaybolmuş" görünür). Buradaki ad klasörden bağımsızdır.
name: adana-ozel-ders

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ceyhandb}
    ports:
      # Host 5433: yerel Windows PostgreSQL servisi 5432'yi dinliyor; çakışmada
      # loopback bağlantıları sessizce YEREL sunucuya gider (yanlış DB). Compose-içi
      # servisler (backend) yine postgres:5432'ye bağlanır — bu yalnız host yayını.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Geliştirme SMTP sunucusu: gönderilen tüm e-postaları yakalar (dışarı çıkmaz).
  # Web arayüzü: http://localhost:8025 — doğrulama/şifre linklerini buradan aç.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Avatar bucket'ını oluşturur ve public-read yapar (tek seferlik init).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
      mc mb -p local/${AWS_BUCKET_NAME:-avatars};
      mc anonymous set download local/${AWS_BUCKET_NAME:-avatars};
      exit 0;
      "

  # ── Rota optimizasyonu (teslimat Faz B) — OPSİYONEL profil ──
  # Varsayılan `docker compose up` bunları KALDIRMAZ; açmak için:
  #   1) scripts/setup-osrm-adana.ps1  (tek seferlik OSM veri hazırlığı)
  #   2) docker compose --profile routing up -d osrm vroom
  # Backend .env: ROUTING_PROVIDER=auto (VROOM yoksa haversine fallback).
  osrm:
    image: osrm/osrm-backend:latest
    profiles: ["routing"]
    # --max-table-size ZORUNLU: VROOM rota kurarken OSRM'in `table` (mesafe
    # matrisi) servisini ÇAĞIRIR ve osrm-routed varsayılanı 100 koordinattır.
    # 100'ü aşan turda OSRM "TooBig" döner, VROOM code=3 verir ve backend
    # `auto` modda SESSİZCE haversine'e düşer — yani kampanya günü (100+ durak)
    # tam da en çok gereken anda gerçek yol ağı devre dışı kalır.
    command: osrm-routed --algorithm mld --max-table-size 500 /data/adana.osrm
    volumes:
      - ./devops/osrm:/data
    ports:
      # Yalnız yerel makineye aç: OSRM/VROOM kimlik doğrulaması OLMAYAN hesap
      # servisleridir; 0.0.0.0'a açık bırakılırsa ağdaki herkes CPU harcatır.
      - "127.0.0.1:5000:5000"
    healthcheck:
      # İmajda wget/curl yok — bash /dev/tcp ile port kontrolü (imaj debian tabanlı).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    profiles: ["routing"]
    depends_on:
      osrm:
        condition: service_healthy
    volumes:
      - ./devops/vroom:/conf
    environment:
      VROOM_ROUTER: osrm
    ports:
      - "127.0.0.1:3000:3000"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ceyhandb}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret}
      AUTO_CREATE_DB: "True"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ceyhan.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      REDIS_URL: redis://redis:6379/0
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_ENDPOINT_URL: http://minio:9000
      # Tarayıcının gördüğü adres: dosya bağlantıları ve imzalı (presigned)
      # adresler bununla üretilir — imza host'u kapsadığı için konteyner-içi
      # `minio` adıyla imzalanan bir adres tarayıcıda geçersiz olur.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-avatars}
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost"]'
      # E-posta: MailHog'a yaz (gerçek sağlayıcı/anahtar gerekmez).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: "False"
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@adanaozelders.com.tr}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Rota optimizasyonu: `--profile routing` açıkken backend container'ı VROOM'a
      # servis adıyla ulaşır (localhost:3000 container içinden çalışmaz). Profil
      # kapalıyken ROUTING_PROVIDER=auto sessizce haversine'e düşer — hard depends_on
      # YOK (profilli servise bağımlılık varsayılan `up`'ı bozardı).
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-auto}
      VROOM_URL: ${VROOM_URL:-http://vroom:3000}
      # Oturumsuz kargo takip linki (SMS). Üretimde kargotakip.* subdomain'i.
      PUBLIC_TRACKING_BASE_URL: ${PUBLIC_TRACKING_BASE_URL:-http://localhost:5173/kargo-takip}
    ports:
      - "8000:8000"

  # ── Ziyaretçi analitiği (opsiyonel profil) ──
  # Çerezsiz ölçüm: çerez kullanan bir analitik, KVKK/ePrivacy gereği açık rıza
  # ister ve siteye çerez onay bandı eklemek zorunda kalırdık.
  #   docker compose --profile analytics up -d umami
  # Sonra Umami arayüzünde (http://localhost:3001) site ekleyip website id'yi
  # frontend .env'ine yazın (VITE_ANALYTICS_*). Ayar yoksa frontend script'i
  # hiç yüklemez — analitik tamamen kapalıdır.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ["analytics"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Umami kendi şemasını ilk açılışta kurar; veritabanının VAR OLMASI yeter.
      # Oluşturma: docker compose exec postgres createdb -U postgres umami
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-gelistirme-icin-rastgele-degil}
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  miniodata:
