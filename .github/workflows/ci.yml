name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Asılı kalan bir adım (ör. erişilemeyen servise bağlanmaya çalışan test)
    # varsayılanda 6 saat runner tutuyordu.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    # Gerçek Postgres: entegrasyon testleri (para yolu, teslimat invariant'ları,
    # kurye rolü, outbox) bunsuz SKIP oluyordu — yani en riskli kod yolları
    # CI'da korumasızdı. Extension'lar (pg_trgm, btree_gist) baseline migration
    # tarafından kurulur, image'da ayrıca bir şey gerekmez.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Redis: `core/ratelimit` ve `core/token_denylist` bilinçli olarak
      # FAIL-OPEN'dır — Redis yoksa limiter saymaz, logout token'ı iptal etmez
      # ve İSTEK YİNE GEÇER. Redis'siz bir CI'da bu iki korumanın bozulması
      # hiçbir testi kırmazdı. `tests/verify/test_verify_redis_infra.py`
      # gerçek Redis'e karşı sayar (bkz. o dosyanın docstring'i).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ci-secret-key-not-for-production
      AUTO_CREATE_DB: "False"
      # Altyapı erişilemezse test ATLANMAZ, KIRILIR (backend/tests/service_guard.py).
      # Sessiz SKIP, "servis konteyneri eksik" hâlini gerçekten koşan bir
      # suite'ten ayırt edilemez kılıyor ve yeşil gösteriyordu.
      CI_REQUIRE_SERVICES: "1"
      REDIS_URL: redis://localhost:6379/0
      # Depolama: TEST amaçlı, tek kullanımlık kimlik bilgileri. Üretim sırrı
      # DEĞİL — MinIO konteyneri aynı değerlerle açılır, iş bitince yok olur.
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: ci-test-user
      AWS_SECRET_ACCESS_KEY: ci-test-secret-key
      AWS_BUCKET_NAME: ci-test-bucket

    steps:
      - uses: actions/checkout@v4

      # MinIO `services:` bloğuna konamıyor: resmi imaj komut ("server /data")
      # gerektiriyor, GitHub service container'ları ise komut geçersiz kılmaya
      # izin vermiyor. Bu yüzden açıkça başlatılıp HAZIR OLMASI BEKLENİR;
      # hazır olmazsa adım kırılır.
      #
      # Neden gerekli: hassas dosyaların (diploma, karne, cevap anahtarı,
      # dijital ürün, teslim kanıtı) gizliliği tek bir şeye dayanıyor —
      # bucket policy'de listelenmemiş olmaları. Birim testi policy JSON'unun
      # METNİNİ doğrular; gerçekten uygulandığını yalnız gerçek depoya sorarak
      # bilebiliriz. MinIO olmadığı için `tests/verify/test_verify_storage_
      # access.py` altı testi de CI'da atlıyordu.
      - name: MinIO (depolama erişim sınırı doğrulaması)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio/minio:latest server /data
          for deneme in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO hazır ($deneme. deneme)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO 60 sn içinde hazır olmadı"
          docker logs minio || true
          exit 1
      - uses: actions/setup-python@v5
        with:
          # Docker imajı ve geliştirme ortamıyla AYNI sürüm — "bende
          # çalışıyordu" farkını kapatır.
          python-version: "3.12"
          cache: pip

      # requirements.txt tam kilitli (pip-compile çıktısı): CI, üretimle
      # birebir aynı sürümleri kurar.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov hypothesis ruff pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Byte-compile
        run: python -m compileall -q .

      # Baseline migration boş bir DB'yi kurabiliyor mu? Şema tek doğruluk
      # kaynağı olduğundan bu, üretim provizyonunun provasıdır.
      - name: Migration — boş DB'ye upgrade head
        run: python -m alembic upgrade head

      # Model ile migration arasında drift kaldı mı? (autogenerate boş çıkmalı)
      - name: Migration — drift kontrolü
        run: python -m alembic check

      # pytest.ini'de `testpaths = tests` olduğundan yol verilmeyen her pytest
      # çağrısı ÜÇ paketi birden toplar. Bu adım yalnız birim/kabul testleridir;
      # integration (gerçek Postgres) ve verify (izole DB + gerçek servis
      # katmanı) kendi adımlarında koşar.
      #
      # `--ignore=tests/verify` bilinçlidir ve ZORUNLUDUR: verify paketinin
      # session guard'ı POSTGRES_DB != adana_verify görünce `pytest.exit(1)`
      # eder — yani buradan toplanırsa 754 birim testi geçtikten SONRA adım
      # kırılır ve ardındaki hiçbir adım koşmaz. Sözleşme
      # `backend/tests/test_ci_workflow.py` ile kilitlidir.
      - name: Unit tests (birim + kabul)
        run: pytest -q --ignore=tests/integration --ignore=tests/verify

      # Gerçek Postgres. `CI_REQUIRE_SERVICES=1` sayesinde DB'ye ulaşılamazsa
      # paket sessizce SKIP olmaz, adım kırılır.
      - name: Integration tests (gerçek Postgres)
        run: pytest tests/integration -q

      # Doğrulama paketi: gerçek servis katmanı + gerçek DB + HTTP.
      #
      # Bu adım eklenene kadar paket YALNIZ yerelde koşuyordu — yani para
      # yollarının en güçlü güvencesi (escrow claim, iade mutabakatı, oturum
      # çerezi, sipariş akışı) CI'da hiç doğrulanmıyordu ve bir regresyon fark
      # edilmeden merge edilebilirdi. Hafta 3'te entegrasyon testleri için
      # bulunan boşluğun aynısı.
      #
      # İzole veritabanı: paket yazdığı satırları teardown'da FİZİKSEL siler,
      # bu yüzden ayrı bir DB'de koşar (yerelde de aynı guard var).
      - name: Doğrulama paketi (gerçek DB + servis katmanı)
        env:
          POSTGRES_DB: adana_verify
        run: |
          python -c "
          import asyncio, asyncpg
          async def main():
              c = await asyncpg.connect(user='test', password='test', database='postgres', host='localhost')
              try:
                  await c.execute('CREATE DATABASE adana_verify')
              except asyncpg.DuplicateDatabaseError:
                  pass
              finally:
                  await c.close()
          asyncio.run(main())
          "
          python -m alembic upgrade head
          pytest tests/verify -q

      # Kapsama eşiği — GERİLEME nöbetçisi, kalite hedefi DEĞİL.
      #
      # KAPSAMI DAR: yalnız `services` + `core`, yalnız BİRİM/KABUL testleriyle.
      # integration ve verify paketleri (gerçek Postgres, gerçek servis katmanı,
      # gerçek HTTP) ölçüme DAHİL DEĞİL — yani bu sayı "sistemin ne kadarı test
      # edilmiş" sorusunun cevabı değildir, "birim testleriyle ulaşılan kod ne
      # kadar" sorusununkidir. Bütün sistem kapsamı gibi sunulmamalı.
      #
      # Eşik ölçülerek seçildi, tahmin edilmedi (30 Tem 2026):
      #   pytest -q --ignore=tests/integration --ignore=tests/verify \
      #     --cov=services --cov=core --cov-report=term
      #   → 10846 satır, 6884 kapsanmayan, TOPLAM %36.53 (raporda %37)
      # 35: ölçülen değerin ~1.5 puan altı. Amaç, kapsamı kayda değer biçimde
      # düşüren bir değişikliği yakalamak; ondalık dalgalanmada CI'yı
      # kırmamak. Kapsam yükseldikçe eşik de yükseltilmeli.
      - name: Test kapsaması — gerileme eşiği
        run: pytest -q --ignore=tests/integration --ignore=tests/verify --cov=services --cov=core --cov-report=term --cov-fail-under=35

      # Bilinen açıklar: şimdilik raporlar, CI'yı kırmaz. Bağımlılıklar
      # pip-compile ile kilitlendikten sonra continue-on-error kaldırılmalı.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: pip-audit --desc || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test

      # Erişilebilirlik regresyonu (eslint-plugin-jsx-a11y). Kural seti dar ve
      # HATA seviyesinde temiz: bir form alanı etiketsiz eklenirse CI kırılır.
      # Gerekçe: kod tabanında 178 <label> vardı ve htmlFor kullanımı sıfırdı;
      # görsel olarak etiketli her alan ekran okuyucu için adsızdı. Gözle
      # yakalanmayan bu sınıf hatayı ancak bir kural tutar.
      - name: Accessibility lint (ESLint)
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      # Üretim bundle'ına giren paketlerdeki açıklar.
      #
      # BİLİNEN İSTİSNA: react-router 7.12+ için "RSC Mode CSRF Bypass"
      # (GHSA-qwww-vcr4-c8h2) raporlanıyor. Bu proje RSC kullanmıyor —
      # declarative SPA (BrowserRouter + Routes), server action yok. `npm audit
      # fix --force` 7.11.0'a düşürür ki O SÜRÜMDE BİZİ GERÇEKTEN ETKİLEYEN 10
      # açık var (<Link> open redirect, useNavigate, XSS). Yani "audit temiz
      # görünsün" diye geri inmek güvenliği AZALTIR. Bu yüzden en güncel sürümde
      # kalıp uyarıyı bilinçli taşıyoruz.
      - name: Dependency audit (npm)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
